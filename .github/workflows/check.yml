name: check
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - run: pnpm run fmt:check
      - run: pnpm run lint
  test:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3.1.2
        with:
          cache: true
          runtime: node@${{ matrix.node-version }}
      - run: pnpm run test

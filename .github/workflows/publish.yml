name: Publish to npm registry
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
      - uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - run: pnpm publish --no-git-checks
